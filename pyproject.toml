[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalina"
version = "0.1.0"
description = "Simple CLI agent that connects to LM Studio (OpenAI-compatible API)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0",
]

[project.scripts]
kalina = "lmstudio_agent:main"

